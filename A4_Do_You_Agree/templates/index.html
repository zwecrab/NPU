<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A4: Do_You_Agree</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>A4: Do_You_Agree</h1>
        <form method="post">
            <label for="sentence_a">Sentence A:</label>
            <textarea id="sentence_a" name="sentence_a" rows="4" required>{{ sentence_a }}</textarea>
            
            <label for="sentence_b">Sentence B:</label>
            <textarea id="sentence_b" name="sentence_b" rows="4" required>{{ sentence_b }}</textarea>
            
            <button type="submit">Calculate Similarity</button>
        </form>
        
        {% if similarity is not none %}
        <div class="result">
            <h2>Cosine Similarity:</h2>
            <p>{{ similarity }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
